<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MM0 Explorer</title>
  </head>
  <body>
    <header id="bar">
      <label class="visually-hidden" for="file" hidden>File</label>
      <select id="file" aria-label="File"></select>
      <span id="state" data-state="checking">checking</span>
      <span id="imports"></span>
      <button id="explore" type="button" title="Compile and open in the proof explorer" disabled>open in explorer →</button>
      <button id="theme" type="button" title="Light / dark" aria-label="Toggle light and dark theme">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="7"/>
          <path d="M12 5a7 7 0 0 0 0 14z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </header>
    <div id="main">
      <aside id="side">
        <section id="outline">
          <h2 class="panel-head">Contents <span class="count" id="outline-count"></span></h2>
          <input id="outline-filter" type="search" placeholder="filter" aria-label="Filter contents">
          <ul id="outline-list"></ul>
        </section>
        <section id="problems">
          <h2 class="panel-head">Problems <span class="count" id="problem-count"></span></h2>
          <ul id="problem-list"></ul>
        </section>
      </aside>
      <div id="container"></div>
    </div>
    <!-- the bundle's script tag is injected by HtmlWebpackPlugin, with the
         content hash in its name; see webpack.config.js -->
  </body>
</html>
