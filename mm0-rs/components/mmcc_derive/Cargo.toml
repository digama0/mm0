[package]
name = "mmcc_derive"
version = "0.1.0"
edition = "2024"
authors = ["Mario Carneiro <di.gama@gmail.com>"]
description = "Derive macros for the mmcc binary encoding"
license = "CC0-1.0"
readme = "README.md"
keywords = ["mmcc", "serialization", "macro"]
categories = ["development-tools", "encoding"]
repository = "https://github.com/digama0/mm0/"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = "2.0"
